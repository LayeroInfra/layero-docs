name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'sidebars.ts'
      - 'docusaurus.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy.sh'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, layero-builder]
    # 15m was chronically tight: install + ru/en build + deploy + the
    # 36-retry CDN-propagation Verify routinely lands at ~14–15m and the
    # 2026-06-25 docs deploy was killed at 15m16s. Give real headroom.
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 — не перестраховка. Docusaurus берёт <lastmod> для
      # sitemap из даты последнего коммита файла; при клоне по умолчанию
      # (глубина 1) история недоступна, и у ВСЕХ страниц окажется одна и та же
      # дата — дата этого прогона. Такой sitemap хуже, чем вовсе без lastmod.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Внешние ссылки Docusaurus не проверяет вовсе — onBrokenLinks про
      # внутренние. Из-за этого в доках жила ссылка на файл приватного
      # репозитория, отдававшая 404 каждому читателю. Шаг валит сборку только
      # на 404/410; 403 и таймауты (защиты от ботов, флапы) — предупреждением.
      - name: Check external links
        run: python3 scripts/check-external-links.py

      - name: Build (ru + en)
        run: npm run build

      - name: Deploy docs
        env:
          BUILD_ID: ${{ github.sha }}
          # Единственная точка публикации с 14.10 — бакет в Selectel ru-6
          # (T-20261013-6). Без ключа deploy.sh отказывается выкладывать.
          SELECTEL_S3_ACCESS_KEY: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
          SELECTEL_S3_SECRET_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
          # s3.layero.ru (core T-20261021-14): шлюз держит бакет у Selectel и YC.
          # Адрес — переменная репозитория S3_ENDPOINT; без неё — Selectel, как раньше.
          SELECTEL_S3_ENDPOINT: ${{ vars.S3_ENDPOINT || 'https://s3.ru-6.storage.selcloud.ru' }}
        run: bash deploy.sh

      - name: Verify
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          # 🚨 Проверяем ИДЕНТИФИКАТОР СБОРКИ, а не наличие сайта. Прежний шаг
          # искал строку «Layero» на главной — она там и при полностью
          # провалившейся заливке, поэтому зелёный ничего не значил.
          want="${BUILD_ID}"
          for i in $(seq 1 36); do
            got=$(curl -sf "https://docs.layero.ru/build-id.txt?cb=$i" | tr -d '[:space:]' || true)
            if [ -n "$got" ] && [ "${want#"$got"}" != "$want" ]; then
              echo "OK: docs.layero.ru отдаёт эту сборку ($got)"
              exit 0
            fi
            sleep 5
          done
          echo "На docs.layero.ru не эта сборка: ждали ${want:0:8}, отдаётся «${got:-—}»" >&2
          exit 1
